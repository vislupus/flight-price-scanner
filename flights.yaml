# ─────────────────────────────────────────────────────────────
#  Полети за следене
# ─────────────────────────────────────────────────────────────
#
#  Всеки маршрут се проверява всеки ден за цяла година напред,
#  в двете посоки, при всяка от избраните авиокомпании.
#
#  Всеки маршрут има:
#    to            – летище (IATA код), напр. BCN
#    name          – (по избор) твое име за дестинацията
#    target_price  – (по избор) желана цена в EUR за отиване + връщане.
#                    Когато има комбинация под нея, идва съобщение в Slack.
#    from          – (по избор) летище на тръгване; иначе settings.home
#    airlines      – (по избор) списък; иначе settings.airlines
#    nights        – (по избор) брой нощувки за известията; иначе settings.nights
#    active        – (по избор) false = спира проверката, историята се пази
# ─────────────────────────────────────────────────────────────

settings:
  home: SOF                     # летище на тръгване по подразбиране
  airlines: [ryanair, wizzair]  # кои авиокомпании се проверяват
  months_ahead: 12              # колко месеца напред (цяла година)

  # За кои пътувания се търсят изгодни комбинации (за Slack и за сайта):
  #   long_weekend – тръгване четвъртък/петък, връщане понеделник/вторник
  #   workweek     – тръгване и връщане в делничен ден (пон–пет)
  #   any          – всички дни
  patterns: [long_weekend, workweek, any]
  nights: [3, 4]                # брой нощувки, за които се търси комбинация

  # Известия
  repeat_alerts_daily: false    # true = всеки ден, докато има цена под целта
  notify_on_errors: true        # Slack съобщение, ако някоя проверка се провали
  alerts_per_route: 3           # най-много толкова комбинации на маршрут в едно съобщение

  request_delay: 1.5            # пауза между заявките (секунди)

routes:
  - to: BCN
    name: Барселона
    target_price: 60

  - to: STN
    name: Лондон (Stansted)
    target_price: 50
    airlines: [ryanair]

  - to: LTN
    name: Лондон (Luton)
    target_price: 50
    airlines: [wizzair]

  - to: DUB
    name: Дъблин
    target_price: 70

  - to: BVA
    name: Париж (Beauvais)
    target_price: 60
    airlines: [ryanair]

  - to: AGP
    name: Малага
    target_price: 70

  - to: PFO
    name: Пафос
    target_price: 50

  - to: WRO
    name: Вроцлав
    target_price: 50

  - to: CPH
    name: Копенхаген
    target_price: 60

  - to: NAP
    name: Неапол
    target_price: 50

  - to: EIN
    name: Айндховен
    target_price: 60

  - to: CRL
    name: Брюксел (Charleroi)
    target_price: 60
