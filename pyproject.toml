[project]
name = "flight-price-scanner"
version = "1.0.0"
description = "Ежедневно следене на цените на Ryanair и Wizz Air със SQLite, Slack известия и сайт в GitHub Pages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.13",
    "pyyaml>=6.0",
    "requests>=2.32",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
